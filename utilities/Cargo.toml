[package]
name = "ofterm-utils"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Terminal helper utilities for OFTerm: imgcat and imgls"

[[bin]]
name = "ofterm-utils"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
  "tiff",
  "ico",
  "pnm",
  "tga",
  "dds",
  "hdr",
  "qoi",
  "exr",
] }
libc = "0.2"
kamadak-exif = "0.6"
unicode-width = "0.2"

# rav1d uses an unstable std feature on 32-bit ARM, so the stable armv7
# build omits AVIF and keeps the other decoders.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
avif-decode = { version = "3.0", default-features = false }
avif-parse = "2.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
