[package]
name = "ofterm-utils"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Terminal helper utilities for OFTerm: imgcat and imgls"

[[bin]]
name = "ofterm-utils"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
  "tiff",
  "ico",
  "pnm",
  "tga",
  "dds",
  "hdr",
  "qoi",
  "exr",
] }
libc = "0.2"
kamadak-exif = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
