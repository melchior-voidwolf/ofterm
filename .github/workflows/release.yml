name: Release

on:
  push:
    branches: [release]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build frontend
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: Install fnpack
        run: |
          curl -fsSL -o /usr/local/bin/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /usr/local/bin/fnpack

      - name: Build FPK (x86 + arm64)
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.0.0' }}
          FNPACK: fnpack
        run: |
          export VERSION="${VERSION#v}"
          node scripts/build-fpk.mjs --all
          (cd build/out && sha256sum *.fpk > SHA256SUMS)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ofterm-fpk
          path: |
            build/out/*.fpk
            build/out/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'release' }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.0.0' }}
        run: |
          VERSION="${VERSION#v}"
          if [ "$TAG" = "release" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Release $VERSION" --prerelease --notes "Rolling release build" 2>/dev/null || true
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "OFTerm $TAG" 2>/dev/null || true
          fi
          for old in ofterm_x86.fpk ofterm_arm.fpk; do
            gh release delete-asset "$TAG" "$old" --yes 2>/dev/null || true
          done
          gh release upload "$TAG" build/out/*.fpk build/out/SHA256SUMS --clobber

      - name: Update FnDepot V2 index on main (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          # build/out is untracked, so the artifacts survive the checkout and
          # the index is generated from the exact bytes just published.
          node scripts/gen-fnpack-v2.mjs
          git add fnpack.json
          git commit -m "chore(fnpack): index v$VERSION" || echo "index unchanged"
          git push origin main
