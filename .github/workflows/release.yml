name: Release

on:
  push:
    branches: [release]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  utils-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf

      - name: Install cross linker
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Linux utilities
        env:
          CLANG: clang
        run: node scripts/build-utils.mjs linux

      - uses: actions/upload-artifact@v4
        with:
          name: utils-linux
          path: build/utils/ofterm-utils-linux-*
          if-no-files-found: error

  utils-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build macOS utilities
        run: node scripts/build-utils.mjs darwin

      - uses: actions/upload-artifact@v4
        with:
          name: utils-darwin
          path: build/utils/ofterm-utils-darwin-*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    # Wait for the macOS job so its artifacts are fully uploaded, but do not
    # let a missing macOS runner block the build: shell fallback covers it.
    needs: [utils-linux, utils-darwin]
    if: always() && needs.utils-linux.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: Install fnpack
        run: |
          curl -fsSL -o /usr/local/bin/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /usr/local/bin/fnpack

      - name: Collect utilities binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: 'utils-*'
          path: build/utils
          merge-multiple: true

      - name: Build FPK (x86 + arm64)
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.1.1' }}
          FNPACK: fnpack
          UTILS_ALLOW_MISSING: '1'
        run: |
          export VERSION="${VERSION#v}"
          chmod +x build/utils/*
          node scripts/build-fpk.mjs --all
          (cd build/out && sha256sum *.fpk > SHA256SUMS)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ofterm-fpk
          path: |
            build/out/*.fpk
            build/out/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'release' }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.1.1' }}
        run: |
          VERSION="${VERSION#v}"
          if [ "$TAG" = "release" ]; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Release $VERSION" --prerelease --notes "Rolling release build" 2>/dev/null || true
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "OFTerm $TAG" 2>/dev/null || true
          fi
          for old in ofterm_x86.fpk ofterm_arm.fpk; do
            gh release delete-asset "$TAG" "$old" --yes 2>/dev/null || true
          done
          gh release upload "$TAG" build/out/*.fpk build/out/SHA256SUMS build/utils/ofterm-utils-* --clobber

      - name: Update FnDepot V2 index on main (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          # build/out is untracked, so the artifacts survive the checkout and
          # the index is generated from the exact bytes just published.
          node scripts/gen-fnpack-v2.mjs
          git add fnpack.json
          git commit -m "chore(fnpack): index v$VERSION" || echo "index unchanged"
          git push origin main
