name: CI

on:
  push:
    branches: [main, feat/ofterm-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Frontend install & test
        working-directory: src/frontend
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: Backend vet & test
        working-directory: src/backend
        run: |
          go vet ./...
          go test ./...

      - name: Install fnpack
        run: |
          curl -fsSL -o /usr/local/bin/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x /usr/local/bin/fnpack

      - name: Build FPK (x86 + arm64)
        env:
          VERSION: 0.1.0-dev
          FNPACK: fnpack
        run: node scripts/build-fpk.mjs --all

      - name: Checksums
        run: cd build/out && sha256sum *.fpk > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ofterm-fpk
          path: |
            build/out/*.fpk
            build/out/SHA256SUMS
          if-no-files-found: error

      - name: Publish nightly pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          make_latest: 'false'
          generate_release_notes: false
          files: |
            build/out/ofterm_x86.fpk
            build/out/ofterm_arm.fpk
            build/out/SHA256SUMS
