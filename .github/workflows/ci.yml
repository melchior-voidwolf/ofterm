name: CI

on:
  push:
    branches: [main, master, feat/ofterm-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Frontend install & test
        working-directory: src/frontend
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - name: Backend vet, test & cross-compile
        working-directory: src/backend
        run: |
          go vet ./...
          go test ./...
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/ofterm-amd64 ./cmd/ofterm
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/ofterm-arm64 ./cmd/ofterm
